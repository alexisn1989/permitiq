<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PermitIQ — Lead detail</title>
<link rel="icon" type="image/png" href="/static/logo-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body class="lead-page">
<header class="topbar">
  <div class="brand">
    <img class="brand-mark" src="/static/logo-icon.png" alt="PermitIQ logo">
    <h1>PermitIQ</h1>
    <span class="tagline">Lead detail · Virginia Beach</span>
  </div>
  <div class="topbar-actions"><a class="btn ghost" href="/">← Map</a></div>
</header>

<div class="queue-banner" id="queue-banner" hidden>
  <span id="queue-text"></span>
  <button class="btn small" id="queue-download">Download review file</button>
  <button class="linklike" id="queue-clear">Clear queue</button>
</div>

<main class="lead" id="lead">
  <p class="muted">Loading…</p>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/static/lead_util.js?v=2"></script>
<script src="/static/lead.js?v=2"></script>
</body>
</html>
